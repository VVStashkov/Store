version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: practice_db
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/migrations:/migrations
      - ./db/seed:/seed
    command: ["postgres", "-c", "log_statement=all"]

  flyway:
    image: flyway/flyway:10
    container_name: practice_flyway
    command: -url=jdbc:postgresql://postgres:5432/Warehouse_DB -user=admin -password=admin_pass migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      - postgres

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin_pass@postgres:5432/Warehouse_DB?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pg_data:
  prometheus_data:
  grafana_data: