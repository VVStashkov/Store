services:
  postgres:
    image: postgres:15
    container_name: practice_db
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5433:5432"
    volumes:
      - ./master_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/migrations:/migrations
      - ./db/seed:/seed
    command: >
      postgres
      -c log_statement=all
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c listen_addresses='*'

  replica1:
    image: postgres:15
    container_name: postgres_replica1
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5437:5432"
    volumes:
      - ./replica1_data:/var/lib/postgresql/data
    depends_on:
      - postgres
    command: >
      postgres
      -c log_statement=all
      -c hot_standby=on
      -c primary_conninfo='host=postgres port=5432 user=replicator password=rep_pass'
      -c primary_slot_name='replica1_slot'

  replica2:
    image: postgres:15
    container_name: postgres_replica2
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5435:5432"
    volumes:
      - ./replica2_data:/var/lib/postgresql/data
    depends_on:
      - postgres
    command: >
      postgres
      -c log_statement=all
      -c hot_standby=on
      -c primary_conninfo='host=postgres port=5432 user=replicator password=rep_pass'
      -c primary_slot_name='replica2_slot'

  logical_subscriber:
    image: postgres:15
    container_name: postgres_logical_subscriber
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5436:5432"
    volumes:
      - ./logical_subscriber_data:/var/lib/postgresql/data
    depends_on:
      - postgres
  shard1:
    image: postgres:15
    container_name: postgres_shard1
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5438:5432"
    volumes:
      - ./shard1_data:/var/lib/postgresql/data
    command: postgres -c log_statement=all

  shard2:
    image: postgres:15
    container_name: postgres_shard2
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5439:5432"
    volumes:
      - ./shard2_data:/var/lib/postgresql/data
    command: postgres -c log_statement=all

  shard_router:
    image: postgres:15
    container_name: postgres_shard_router
    environment:
      POSTGRES_DB: Warehouse_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5440:5432"
    volumes:
      - ./shard_router_data:/var/lib/postgresql/data
    command: postgres -c log_statement=all
  flyway:
    image: flyway/flyway:10
    container_name: practice_flyway
    command: -url=jdbc:postgresql://postgres:5432/Warehouse_DB -user=admin -password=admin_pass migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      - postgres

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin_pass@postgres:5432/Warehouse_DB?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pg_data:
  prometheus_data:
  grafana_data: